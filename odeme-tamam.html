<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ödeme Sonucu · Sorbi</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F14;--ink:#E8E4DA;--mut:#A9A396;--dim:#8A8578;--gold:#C9A962;--gold-lt:#E4CF9A;--terra:#C4744E;--line:rgba(235,240,248,.08);--lineg:rgba(201,169,98,.22);--lineg2:rgba(201,169,98,.45)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1000px 560px at 50% -8%,#12171f,#0B0F14 62%);color:var(--ink);font-family:'Inter',sans-serif;padding:2rem 1.1rem}
.card{max-width:440px;text-align:center;background:linear-gradient(180deg,rgba(201,169,98,.14),rgba(22,26,37,.6));border:1px solid var(--lineg2);border-radius:20px;padding:2.2rem 1.6rem}
.ic{font-size:2.2rem}
h1{font-family:'Playfair Display',serif;font-size:1.6rem;margin:.6rem 0 .5rem}
p{color:var(--mut);font-size:.95rem;line-height:1.6;margin:0 auto 1.3rem;max-width:360px}
a.btn{display:inline-block;text-decoration:none;background:var(--terra);color:#F6EFE1;font-weight:600;padding:.85rem 1.7rem;border-radius:99px;font-size:.95rem}
a.ghost{display:block;margin-top:.9rem;color:var(--gold-lt);text-decoration:none;font-size:.85rem}
.brand{font-family:'Playfair Display',serif;letter-spacing:3px;color:var(--gold);font-size:.72rem;text-transform:uppercase;text-decoration:none;display:block;margin-bottom:1.2rem}
</style></head><body>
<div class="card">
 <a href="/" class="brand">✦ Sorbi</a>
 <div class="ic" id="ic">✦</div>
 <h1 id="ttl">Ödemeni kontrol ediyoruz…</h1>
 <p id="msg">Bir saniye — ödeme sonucunu doğruluyoruz.</p>
 <div id="act"></div>
</div>
<script>
(function(){
 function qs(k){return new URLSearchParams(location.search).get(k);}
 var oid=qs('order');
 try{if(!oid){var so=JSON.parse(localStorage.getItem('sorbi_order')||'null');if(so)oid=so.id;}}catch(e){}
 var svc='natal-harita';try{var so2=JSON.parse(localStorage.getItem('sorbi_order')||'null');if(so2&&so2.svc)svc=so2.svc;}catch(e){}
 var ic=document.getElementById('ic'),ttl=document.getElementById('ttl'),msg=document.getElementById('msg'),act=document.getElementById('act');
 function paidUI(){
   try{var pd=JSON.parse(localStorage.getItem('sorbi_paid')||'{}');pd[svc]=true;localStorage.setItem('sorbi_paid',JSON.stringify(pd));}catch(e){}
   ic.textContent='✓';ttl.textContent='Ödemen alındı ✨';
   msg.textContent='Teşekkürler! Detaylı raporunun kilidi açıldı. Aşağıdan haritana dön.';
   act.innerHTML='<a class="btn" href="/dogum-haritasi-hesaplama">Raporuma dön →</a><a class="ghost" href="/haritam">Evime git</a>';
 }
 function pendingUI(){ttl.textContent='Ödemen işleniyor…';msg.textContent='Ödeme onayı birkaç saniye sürebilir. Bu sayfa kendini yeniler.';}
 function failUI(){ic.textContent='✕';ttl.textContent='Ödeme tamamlanmadı';msg.textContent='Ödeme alınamadı ya da yarıda kaldı. Tekrar deneyebilirsin.';act.innerHTML='<a class="btn" href="/dogum-haritasi-hesaplama">Tekrar dene</a>';}
 if(!oid){failUI();return;}
 var tries=0;
 function check(){
   tries++;
   fetch('/api/bookings/'+encodeURIComponent(oid)).then(function(r){return r.json();}).then(function(j){
     var st=(j&&j.status)||'';
     if(st==='approved'){paidUI();}
     else if(st==='rejected'){failUI();}
     else{pendingUI();if(tries<6)setTimeout(check,2500);else{msg.textContent='Onay henüz gelmedi. Ödeme başarılıysa raporun kısa sürede açılır; sayfayı yenileyebilirsin.';act.innerHTML='<a class="ghost" href="/dogum-haritasi-hesaplama">Haritama dön</a>';}}
   }).catch(function(){if(tries<6)setTimeout(check,2500);else failUI();});
 }
 check();
})();
</script>
</body></html>
