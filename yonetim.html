<style>

/* Altı rol, iki gökyüzü. Gece varsayılan; gündüz [data-tema="gunduz"] ile.
   Renkler burada tanımlanır, sayfalar yalnız değişken kullanır. */
:root{--bg:#0B0810;--bg-rgb:11,8,16;--ink:#F2EFE9;--ink-rgb:242,239,233;
  --mut:#A5A3AE;--mut-rgb:165,163,174;--dim:#807E8B;--dim-rgb:128,126,139;

html{background:var(--bg)}
body{background:transparent!important}

/* Katman zanaatı: gölge görülmez, hissedilir. Mürekkep zemin gölgeyi yuttuğu için
   kart kenar çizgisi ve iç parlamayla ayrışır — ağır gölge yok.
   Kart yüzeyi üstten hafif aydınlanır, üst kenarda 1px ışık, altta zemine dikiş. */
/* Kart yuzeyi yukselince --dim kart ustunde AA'nin altina dusuyor (4,40);
   kart kapsaminda en sonuk metin rolu --mut kademesine cikar. */
.card,.bk-kart,.bk-yol,.yol,.tablo,.b3,.tr,.sbg,.cta,.sectcard,.question-card,.how-step,.savecard,.uy-yol,
.tool,.form,.lim,.ex-q,.pane,.modes,.adv,.adim,.nb,.per,.note,.ipucu,.hint{--dim:var(--mut);--muted:var(--mut)}

<script>
/* Gökyüzüne göre tema. İlk boyamadan önce çalışır ki sayfa titremesin.
   Kullanıcı seçtiyse (sorbi_tema) o; seçmediyse gerçek gündoğumu/günbatımı
   (NOAA yaklaşımı, kayıtlı doğum yeri ya da İstanbul). */
(function(){
 var H=document.documentElement;
 function gunes(lat,lon,d){
  var r=Math.PI/180, n=Math.floor((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(d.getUTCFullYear(),0,0))/864e5);
  var g=2*Math.PI/365*(n-1+(d.getUTCHours()-12)/24);
  var eq=229.18*(7.5e-5+1.868e-3*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  var dec=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  var ha=Math.acos(Math.cos(90.833*r)/(Math.cos(lat*r)*Math.cos(dec))-Math.tan(lat*r)*Math.tan(dec))/r;
  var dogus=720-4*(lon+ha)-eq, batis=720-4*(lon-ha)-eq;   /* UTC dakika */
  var simdi=d.getUTCHours()*60+d.getUTCMinutes();
  return simdi>dogus&&simdi<batis?'gunduz':'gece';
 }
 var t=null; try{t=localStorage.getItem('sorbi_tema');}catch(e){}
 if(t!=='gunduz'&&t!=='gece'){
  var lat=41.0082,lon=28.9784;
  try{var b=JSON.parse(localStorage.getItem('sorbi_birth')||'null'); if(b&&+b.lat&&+b.lon){lat=+b.lat;lon=+b.lon;}}catch(e){}
  t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'gunduz':'gece'; /* kullanıcı seçmediyse sistem tercihi */
 }
 if(t==='gunduz') H.setAttribute('data-tema','gunduz'); else H.removeAttribute('data-tema');
 function meta(){var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content',H.getAttribute('data-tema')==='gunduz'?'#F6F3EC':'#0B0810');}
 function dugme(){
  var nav=document.querySelector('.sbnav'); if(!nav||document.getElementById('temaDugme')) return;
  var b=document.createElement('button'); b.id='temaDugme'; b.type='button';
  function yaz(){var g=H.getAttribute('data-tema')==='gunduz'; b.textContent=g?'☾':'☀'; b.setAttribute('aria-label',g?'Gece temasına geç':'Gündüz temasına geç'); b.title=b.getAttribute('aria-label');}
  b.onclick=function(){var g=H.getAttribute('data-tema')==='gunduz'; if(g) H.removeAttribute('data-tema'); else H.setAttribute('data-tema','gunduz'); try{localStorage.setItem('sorbi_tema',g?'gece':'gunduz');}catch(e){} yaz(); meta(); if(window.SorbiChart&&window.SorbiChart.yenile) try{window.SorbiChart.yenile();}catch(e){}};
  yaz(); nav.appendChild(b);
 }
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){meta();dugme();}); else {meta();dugme();}
})();
</script>
